services:
  wavecheck:
    build: .
    image: wavecheck:latest
    container_name: wavecheck
    ports:
      - "8000:8000"
    environment:
      WAVECHECK_DB: /data/wavecheck.db
    volumes:
      - wavecheck-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/docs').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  wavecheck-data:
